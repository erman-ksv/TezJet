name: TezJet CI Gate

on:
  push:
    branches:
      - main
      - "dev/**"
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate:
    name: Typecheck, build, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: 5173
      BASE_PATH: /
      API_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        env:
          PORT: 5173
          BASE_PATH: /
          API_URL: http://localhost:8080
        run: pnpm run build

      - name: API tests
        run: pnpm test
