name: TezJet CI Gate

on:
  push:
    branches:
      - main
      - "dev/**"
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate:
    name: Typecheck, build, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: API tests
        run: pnpm test
