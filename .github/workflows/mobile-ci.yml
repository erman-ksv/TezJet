name: TezJet Mobile CI

on:
  pull_request:
    paths:
      - "mobile/tezjet-app/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches:
      - "feature/tezjet-unified-mobile-expo"
    paths:
      - "mobile/tezjet-app/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/tezjet-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        run: pnpm install
      - name: Typecheck
        run: pnpm typecheck
      - name: Export Android and iOS bundles
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
        run: pnpm exec expo export --platform android --platform ios
      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android native project
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Assemble Android debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tezjet-android-debug-apk
          path: mobile/tezjet-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
